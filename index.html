<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página de Enlaces</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="fondo-blur"></div>

  <div class="contenedor">

    <div class="perfil">
      <img src="img/foto-perfil.jpg" alt="Foto de perfil" class="foto-perfil">
      <h1>Tu Nombre</h1>
      <p class="bio">Aquí va tu descripción / bio</p>

      <div class="redes">
        <a href="#"><img src="img/icono1.png" alt="red social"></a>
        <a href="#"><img src="img/icono2.png" alt="red social"></a>
        <a href="#"><img src="img/icono3.png" alt="red social"></a>
      </div>
    </div>

    <div class="enlaces">
      <a href="#" class="tarjeta destacada">
        <img src="img/imagen-destacada.jpg" alt="Enlace destacado">
      </a>

      <a href="#" class="tarjeta">
        <span class="icono">🐦</span>
        <span>Twitter</span>
      </a>

      <a href="#" class="tarjeta">
        <span class="icono">🟠</span>
        <span>Reddit</span>
      </a>
    </div>

  </div>

</body>
</html>
