<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catty Gold</title>
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-landing.css">
</head>
<body>

  <div class="fondo-landing"></div>
  <div class="overlay-landing"></div>

  <div class="landing-contenedor">

    <h1 class="landing-titulo">Catty Gold</h1>

    <p class="landing-texto">Step into my private world, where curiosity meets exclusivity.</p>

    <div class="landing-redes">
      <a href="https://x.com/Kitty_Cat_l0" target="_blank">
        <img src="img/x.png" alt="X (Twitter)">
      </a>
      <a href="https://www.instagram.com/catty_gold._?stkn=MTkxZTkweG84ZDV4bg==" target="_blank">
        <img src="img/instagram.png" alt="Instagram">
      </a>
      <a href="https://www.snapchat.com/add/catty_gold?share_id=ytNeliYaeS0&locale=en-GB" target="_blank">
        <img src="img/snapchat.png" alt="Snapchat">
      </a>
    </div>

    <button id="btn-entrar" class="landing-boton">Enter Private Space</button>

  </div>

  <!-- Modal / verificador de edad -->
  <div id="modal-edad" class="modal-overlay" hidden>
    <div class="modal-caja">
      <h2>Verificación de edad</h2>
      <p>Este sitio contiene material para mayores de 18 años. ¿Confirmas que tienes 18 años o más?</p>
      <div class="modal-botones">
        <button id="btn-si" class="modal-btn si">Sí, soy mayor de 18</button>
        <button id="btn-no" class="modal-btn no">No, salir</button>
      </div>
    </div>
  </div>

  <script>
    const btnEntrar = document.getElementById('btn-entrar');
    const modal = document.getElementById('modal-edad');
    const btnSi = document.getElementById('btn-si');
    const btnNo = document.getElementById('btn-no');

    btnEntrar.addEventListener('click', () => {
      if (sessionStorage.getItem('edadVerificada') === 'true') {
        window.location.href = 'home.html';
      } else {
        modal.hidden = false;
      }
    });

    btnSi.addEventListener('click', () => {
      sessionStorage.setItem('edadVerificada', 'true');
      window.location.href = 'home.html';
    });

    btnNo.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'about:blank';
      }
    });
  </script>

</body>
</html>
